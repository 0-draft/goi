minimumReleaseAgeExclude:
  - "@biomejs/biome@2.6.3"
  - "@biomejs/cli-android-arm64@2.6.3"
  - "@biomejs/cli-android-x64@2.6.3"
  - "@biomejs/cli-darwin-arm64@2.6.3"
  - "@biomejs/cli-darwin-x64@2.6.3"
  - "@biomejs/cli-linux-arm64-musl@2.6.3"
  - "@biomejs/cli-linux-arm64@2.6.3"
  - "@biomejs/cli-linux-x64-musl@2.6.3"
  - "@biomejs/cli-linux-x64@2.6.3"
  - "@biomejs/cli-win32-arm64@2.6.3"
  - "@biomejs/cli-win32-x64@2.6.3"

# markdownlint-cli2 0.24.0 (latest) pins markdownlint 0.42.0, which brings
# re2js 2.8.6 and katex ^0.16; neither range reaches the patched releases.
# Drop these once markdownlint-cli2 ships on markdownlint 0.42.1 or later.
overrides:
  katex: ^0.18.2
  re2js: ^2.9.1
  # @napi-rs/wasm-runtime accepts @emnapi/* "^1.7.1 || ^2.0.0-alpha.4" as peers,
  # so a lockfile refresh can resolve the 2.0.0 prereleases, which crash when
  # @astrojs/check loads and make `astro check` fail. Keep them on 1.x.
  "@emnapi/core": ^1.11.3
  "@emnapi/runtime": ^1.11.3
