name: Visual baseline

# 見た目の回帰テストの基準画像を、CI と同じコンテナで作り直して artifact に置く。
# 中身を確認してから tests/e2e/visual.spec.ts-snapshots/ にコミットする（自動コミットはしない）
on:
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm test:visual --update-snapshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-snapshots
          path: tests/e2e/visual.spec.ts-snapshots
          retention-days: 7
